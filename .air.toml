root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Goをビルドして起動するコマンド（NODE_ENV=development をここで付与）
  # Windows環境（CMD/PowerShell）と Mac/Linux で記述が異なるため注意（後述）
  cmd = "go build -o ./tmp/main ."
  full_bin = "NODE_ENV=development ./tmp/main"
  
  # 監視するファイルの拡張子（Go関連ファイルのみに絞る）
  include_ext = ["go", "tpl", "tmpl", "html", "toml"]
  
  # ★超重要：フロントエンドのディレクトリを完全に無視する
  # ここを指定しないと、Viteの一時ファイル等に反応してGoが無限に再起動します
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "front"]
  
  # 監視から除外する特定のファイルパターン
  exclude_file = []
  exclude_regex = ["_test.go"]
  
  # 変更を検知してからビルドが走るまでのディレイ（ミリ秒）
  delay = 1000 # 1秒
  
  # ビルドエラーが発生したときに、古いバイナリでサーバーを維持するか
  keep_scroll = true
  stop_on_error = true
  
  # ログの色付け
  log = "air.log"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
